name: VibeFusion
options:
  bundleIdPrefix: app.vibefusion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  VibeFusionKit:
    path: Packages/VibeFusionKit
targets:
  VibeFusion:
    type: application
    platform: iOS
    sources:
      - path: VibeFusion
    dependencies:
      - package: VibeFusionKit
        product: VFCore
      - package: VibeFusionKit
        product: VFAudio
      - package: VibeFusionKit
        product: VFDesignSystem
    info:
      path: VibeFusion/Info.plist
      properties:
        CFBundleDisplayName: VibeFusion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        VFAPIBaseURL: http://localhost:8080
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: VibeFusion connects to a development server on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: app.vibefusion.listen
            CFBundleURLSchemes: [vibefusion]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibefusion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
  VibeFusionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VibeFusionUITests]
    dependencies:
      - target: VibeFusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibefusion.ios.uitests
        TEST_TARGET_NAME: VibeFusion
schemes:
  VibeFusion:
    build:
      targets:
        VibeFusion: all
        VibeFusionUITests: [test]
    test:
      targets:
        - VibeFusionUITests
        - package: VibeFusionKit/VFCoreTests
        - package: VibeFusionKit/VFAudioTests
