name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts:validate
      - name: Fixtures are up to date
        run: npm run fixtures && git diff --exit-code ../contracts/fixtures

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Package tests (envelope parity, scheduler, API client, offline render)
        working-directory: ios/Packages/VibeFusionKit
        run: xcodebuild test -scheme VibeFusionKit-Package -destination 'platform=iOS Simulator,name=iPhone 16' | xcpretty || exit ${PIPESTATUS[0]}
      - name: Build app
        run: xcodebuild build -project VibeFusion.xcodeproj -scheme VibeFusion -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:model:test :core:network:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
